name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译主程序
        run: dotnet build src/ScreenRemind/ScreenRemind.csproj -c Release

      - name: 跑逻辑自检
        run: dotnet run --project tests/SelfTest/SelfTest.csproj -c Release

      - name: 验证单文件发布产物
        run: dotnet publish src/ScreenRemind/ScreenRemind.csproj -c Release -o out

      # 产物留档：便于在不装 SDK 的机器上取回 CI 构建出的 exe（发版打包时用）
      - name: 上传单文件产物
        uses: actions/upload-artifact@v4
        with:
          name: CapAlert-single-file
          path: out/截图提醒.exe
          retention-days: 3
          if-no-files-found: warn

      # GUI 子系统（WinExe）不能直接调用后取 $LASTEXITCODE：
      # pwsh 不等待它结束，$LASTEXITCODE 为 $null，而 $null -ne 0 恒为真，会把「成功」判成失败。
      # 必须 Start-Process -Wait -PassThru 拿到真实退出码。
      - name: 生成运行期诊断报告
        run: |
          $p = Start-Process -FilePath ".\out\截图提醒.exe" -ArgumentList "--check" -Wait -PassThru
          Write-Host "诊断退出码: $($p.ExitCode)"

          $report = Get-ChildItem "$env:RUNNER_TEMP\ScreenRemindSelfCheck" -Recurse -Filter "selfcheck_*.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -eq 0) {
            Write-Host "诊断全部通过"
          }
          elseif ($report) {
            # 退出码 2 = 有检查项未通过。云端 runner 无交互桌面，抓屏必然全黑、热键不可用，
            # 这类失败是环境属性而非代码缺陷，故只告警不阻断；报告仍会作为 artifact 上传。
            Write-Host "::warning::诊断有未通过项（退出码 $($p.ExitCode)），详见 selfcheck-report"
          }
          else {
            throw "未生成诊断报告且退出码 $($p.ExitCode)，疑似启动即失败"
          }
        shell: pwsh

      - name: 上传诊断报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-report
          # 用 runner.temp 而不是 env.TEMP：后者在表达式上下文里取不到值
          path: ${{ runner.temp }}/ScreenRemindSelfCheck/**/logs/selfcheck_*.txt
          if-no-files-found: warn
